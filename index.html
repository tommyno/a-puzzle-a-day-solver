<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A-Puzzle-A-Day Solver</title>
    <meta
      name="description"
      content="Stuck on today's A-Puzzle-A-Day? Pick any date to see how many solutions it has, and get hints one piece at a time."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://a-puzzle-a-day-solver.vercel.app"
    />
    <meta property="og:title" content="A-Puzzle-A-Day Solver" />
    <meta
      property="og:description"
      content="Stuck on today's A-Puzzle-A-Day? Pick any date to see how many solutions it has, and get hints one piece at a time."
    />
    <meta
      property="og:image"
      content="https://a-puzzle-a-day-solver.vercel.app/images/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The A-Puzzle-A-Day board with wooden pieces placed, leaving May 17 uncovered"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <main>
      <header>
        <input type="date" id="date" aria-label="Date" />
        <p class="count">
          <span id="count-number"></span>
          <span id="count-label"></span>
        </p>
      </header>

      <div class="frame">
        <!-- Drawn by app.js, which also sets the viewBox -->
        <svg id="board">
          <defs>
            <!-- Wood grain, laid over each piece's colour -->
            <pattern
              id="grain-h"
              patternUnits="userSpaceOnUse"
              width="1"
              height="64"
              patternTransform="rotate(1.5)"
            >
              <rect
                width="1"
                y="6"
                height="2"
                fill="#fff0d2"
                fill-opacity="0.1"
              />
              <rect
                width="1"
                y="13"
                height="2"
                fill="#321905"
                fill-opacity="0.1"
              />
              <rect
                width="1"
                y="22"
                height="4"
                fill="#321905"
                fill-opacity="0.06"
              />
              <rect
                width="1"
                y="35"
                height="2"
                fill="#321905"
                fill-opacity="0.09"
              />
              <rect
                width="1"
                y="44"
                height="3"
                fill="#fff0d2"
                fill-opacity="0.08"
              />
              <rect
                width="1"
                y="53"
                height="3"
                fill="#321905"
                fill-opacity="0.07"
              />
            </pattern>
            <pattern
              id="grain-v"
              href="#grain-h"
              patternTransform="rotate(91.5)"
            />
          </defs>
          <g id="layer"></g>
          <text class="logo" id="logo">A-PUZZLE-A-DAY</text>
        </svg>
      </div>

      <div class="buttons">
        <button id="hint" class="primary">Hint</button>
        <button id="other">Other solution</button>
      </div>

      <p id="cooldown" hidden></p>
    </main>

    <footer>
      <p>
        Buy the original puzzle made by
        <a
          href="https://www.dragonfjord.com"
          target="_blank"
          rel="noopener noreferrer"
          >DragonFjord ↗</a
        >
      </p>
      <p>
        Fork on
        <a
          href="https://github.com/tommyno/a-puzzle-a-day-solver"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub ↗</a
        >
      </p>
    </footer>

    <script type="module" src="scripts/app.js"></script>
  </body>
</html>
